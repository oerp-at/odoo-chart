{{- if and .Values.argocd.enabled .Values.setup -}}
{{- if not .Values.argocd.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "odoo.fullname" . }}-argocd-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "odoo.fullname" . }}-argocd-setup
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "odoo.fullname" . }}-argocd-setup
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "odoo.fullname" . }}-argocd-setup
subjects:
  - kind: ServiceAccount
    name: {{ include "odoo.fullname" . }}-argocd-setup
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "odoo.fullname" . }}-argocd-setup
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.argocd.serviceAccount | default (printf "%s-argocd-setup" (include "odoo.fullname" .)) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: argocd-setup
          image: "{{ .Values.scaleDown.image.repository }}:{{ .Values.scaleDown.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              APP_NAME="{{ .Values.argocd.appName | default .Release.Name }}"
              ARGOCD_NS="{{ .Values.argocd.namespace }}"
              PARAM="{{ .Values.argocd.setupParam }}"

              echo "Setting $PARAM=false on ArgoCD Application $APP_NAME (namespace $ARGOCD_NS) ..."

              PARAMS_RAW=$(kubectl get application "$APP_NAME" -n "$ARGOCD_NS" \
                -o jsonpath='{.spec.source.helm.parameters}' 2>/dev/null || true)

              if [ -z "$PARAMS_RAW" ]; then
                kubectl patch application "$APP_NAME" -n "$ARGOCD_NS" --type=json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/source/helm/parameters\",\"value\":[{\"name\":\"$PARAM\",\"value\":\"false\"}]}]"
                echo "Created parameters array with $PARAM=false."
                exit 0
              fi

              IDX=0
              FOUND=false
              for NAME in $(kubectl get application "$APP_NAME" -n "$ARGOCD_NS" \
                -o jsonpath='{range .spec.source.helm.parameters[*]}{.name}{"\n"}{end}'); do
                if [ "$NAME" = "$PARAM" ]; then
                  FOUND=true
                  break
                fi
                IDX=$((IDX + 1))
              done

              if [ "$FOUND" = "true" ]; then
                kubectl patch application "$APP_NAME" -n "$ARGOCD_NS" --type=json \
                  -p "[{\"op\":\"replace\",\"path\":\"/spec/source/helm/parameters/$IDX/value\",\"value\":\"false\"}]"
                echo "Updated existing parameter at index $IDX."
              else
                kubectl patch application "$APP_NAME" -n "$ARGOCD_NS" --type=json \
                  -p "[{\"op\":\"add\",\"path\":\"/spec/source/helm/parameters/-\",\"value\":{\"name\":\"$PARAM\",\"value\":\"false\"}}]"
                echo "Appended new parameter."
              fi

              echo "Done."
{{- end }}
