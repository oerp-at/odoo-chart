{{- if and .Values.scaleDown.enabled (not .Values.setup) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "odoo.fullname" . }}-scaledown
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-13"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "odoo.fullname" . }}-scaledown
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-13"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "odoo.fullname" . }}-scaledown
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-13"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "odoo.fullname" . }}-scaledown
subjects:
  - kind: ServiceAccount
    name: {{ include "odoo.fullname" . }}-scaledown
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "odoo.fullname" . }}-scaledown
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-12"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "odoo.fullname" . }}-scaledown
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scaledown
          image: "{{ .Values.scaleDown.image.repository }}:{{ .Values.scaleDown.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              NS="{{ .Release.Namespace }}"
              TIMEOUT="{{ .Values.scaleDown.timeout }}"

              scale_down() {
                DEPLOY="$1"
                kubectl get deployment "$DEPLOY" -n "$NS" >/dev/null 2>&1 || {
                  echo "Deployment $DEPLOY not found – skipping."
                  return 0
                }
                echo "Scaling down $DEPLOY ..."
                kubectl scale deployment "$DEPLOY" --replicas=0 -n "$NS"
                WAITED=0
                while [ "$WAITED" -lt "$TIMEOUT" ]; do
                  REMAINING=$(kubectl get pods -n "$NS" --no-headers 2>/dev/null \
                    | grep "^${DEPLOY}-" | wc -l)
                  if [ "$REMAINING" -eq 0 ]; then
                    echo "$DEPLOY scaled down, all pods terminated."
                    return 0
                  fi
                  echo "  Waiting for $REMAINING terminating pod(s) of $DEPLOY ..."
                  sleep 3
                  WAITED=$((WAITED + 3))
                done
                echo "Timeout waiting for pods of $DEPLOY to terminate."
                return 1
              }

              FULLNAME="{{ include "odoo.fullname" . }}"
              scale_down "${FULLNAME}-worker"
              scale_down "${FULLNAME}-cron"
              echo "Scale-down complete."
{{- end }}
